function tick(){const n=new Date();qs('#hour').textContent=n.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});qs('#date').textContent=n.toLocaleDateString('pl-PL')}tick();setInterval(tick,30000);showApp('welcome');setTimeout(()=>{qs('#boot').classList.add('hide');setTimeout(()=>qs('#boot').remove(),750)},900);
